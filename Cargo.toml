# The `glyphcull` umbrella crate AND the compiler workspace manifest.
#
# `glyphcull` is the single entry point for the compiler workspace: it re-exports
# the format contract (`glyphcull-format`) and the CLI (`glyphcull-cli`), and will
# re-export the pipeline crates (`glyphcull-semantic`, `glyphcull-chunk`,
# `glyphcull-atlas`) as Phase 2 lands.

[package]
name = "glyphcull"
# Republished at 0.2.0: the 0.1.0 artifact predates the Phase 2 pipeline
# re-exports and the `cull compile` command; SemVer minor bump.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GlyphCull — a compiled GPU document runtime. Umbrella crate for the compiler workspace: the .cull format contract, the `cull` CLI, and the compile pipeline."
keywords = ["document", "format", "gpu", "runtime", "compiled"]
categories = ["encoding", "parser-implementations", "command-line-utilities"]
readme = "README.md"
# The umbrella package is just the re-export surface; the pipeline crates are
# separate packages on crates.io.
exclude = ["crates/**", "docs/**", "scripts/**", "tests/**", "release/**", ".github/**"]

[dependencies]
glyphcull-format = { version = "0.1.0", path = "crates/glyphcull-format" }
glyphcull-cli = { version = "0.2.0", path = "crates/glyphcull-cli" }
glyphcull-pipeline = { version = "0.1.0", path = "crates/glyphcull-pipeline" }

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/glyphcull-format",
    "crates/glyphcull-cli",
    "crates/glyphcull-semantic",
    "crates/glyphcull-chunk",
    "crates/glyphcull-atlas",
    "crates/glyphcull-pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["GlyphCull contributors"]
repository = "https://github.com/infinityabundance/glyphcull-compiler"

# Lint policy: correctness-focused and security-critical lints are denies;
# stylistic groups (`pedantic`, `nursery`) are deliberately not enabled because
# they produce noise without safety value. `unwrap/expect/panic` and direct
# indexing are denied because untrusted input must never reach those paths.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
correctness = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
