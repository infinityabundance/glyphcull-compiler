name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Receipt validation resolves the recorded ancestor commits.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --all --all-targets
      - name: Doc build
        run: cargo doc --all --no-deps
      - name: Bench smoke
        run: cargo bench --all -- --test
      - name: Package dry-run (every crate packages cleanly)
        run: ./scripts/ci-package.sh
      - name: Release receipts (schema, git, source-hash honesty, completeness)
        run: release/scripts/check-release-receipts.sh --fast
      - name: Golden byte-exactness
        run: |
          ./scripts/check-golden.sh
          ./scripts/check-goldens.sh
      - name: CLI smoke (compile md + html, validate, inspect, determinism)
        run: ./scripts/ci-smoke.sh
