[package]
name = "glyphcull-cli"
# Republished at 0.2.0: the 0.1.0 artifact predates the Phase 2 pipeline
# (the `cull compile` subcommand); SemVer minor bump for the new command.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The `cull` command-line tool: compile, validate, and inspect .cull packages (GlyphCull compiled GPU document runtime)."
keywords = ["document", "format", "cli", "compiler", "gpu"]
categories = ["command-line-utilities", "encoding"]

[lints]
workspace = true

[dependencies]
glyphcull-format = { version = "0.1.0", path = "../glyphcull-format" }

[[bin]]
name = "cull"
path = "src/main.rs"

[dependencies.glyphcull-pipeline]
version = "0.1.0"
path = "../glyphcull-pipeline"
