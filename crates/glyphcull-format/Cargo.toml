[package]
name = "glyphcull-format"
# 0.1.1: the validator now allows block children under Quote (quote →
# paragraph trees, which the compiler emits); 0.1.0 rejected them, so the
# published validator disagreed with the compiler's output. Plus an
# intra-doc-link cleanup (util.rs).
# 0.1.2: the v1 compatibility rules (hardening pass) — flags bit 0 = critical
# (unknown noncritical sections skipped, critical ones rejected),
# canonical known-section order enforced, INFO required at the container.
# 0.1.3: Error::Validation { detail } — the compiler's self-validation failure
# lists the issues (section + message) instead of the opaque UnknownValue 0.
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reference implementation of the .cull document package format (container, section codecs, validation)."
keywords = ["document", "format", "gpu", "runtime", "compiled"]
categories = ["encoding", "parser-implementations"]
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
flate2 = "1.0"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
